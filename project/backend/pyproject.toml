[project]
name = "hardware-deal-tracker"
version = "0.2.0"
description = "AI-Powered Enterprise Hardware Deal Tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.19",
    "email-validator>=2.2.0",
    "apscheduler>=3.11.2,<4",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout with several top-level dirs (app, alembic, scripts): be explicit so
# the wheel/editable build is deterministic and only ships the application package.
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# B008: FastAPI uses `Depends(...)` as an argument default by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML email templates have inherently long lines.
"app/services/notifications/email.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_ebay: hits the live eBay API; skipped unless real creds are set and USE_MOCK_EBAY=false",
    "live_smoke: hits live external services (OpenRouter/vLLM/Telegram/SMTP); needs live creds and is skipped by default (CI excludes it)",
    "community_live: hits the live Reddit OAuth API (r/homelabsales); needs Reddit creds and is skipped by default (CI excludes it)",
]
